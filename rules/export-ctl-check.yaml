# 出口管制物项核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"出口管制物项台账"的**齐备与闭环**：
#     物项是否标明是否受控、受控物项是否填写许可证号、
#     许可证是否有发证日期、最终用途与最终用户是否填写、
#     目的国是否填写、项号与许可证号是否唯一、是否残留模板占位符。
#   其规范载体是**《中华人民共和国出口管制法》**与**两用物项出口许可证管理办法**，
#   以及商务主管部门公布的**两用物项出口管制清单**。
#   ⚠️ **《出口管制法》全文已逐字核对**（商务部官网，见 rules/evidence/clause-verification.md）：
#     主席令**第五十八号**，**2020-10-17 通过，自 2020-12-01 起施行**；核到**第四条**（国家实行统一的
#     出口管制制度，通过制定**管制清单**、实施**出口许可**等方式进行管理）、**第九条**（清单由主管部门
#     制定、调整**并及时公布**；并可实施**临时管制**，期限**不超过二年**，期满评估）、**第十二条**
#     （出口实行**许可制度**）、**第十三条**（审查因素含出口目的国、最终用户和最终用途）、**第十五条**
#     （应提交**最终用户和最终用途证明文件**）、**第十六条**（最终用户**不得擅自改变最终用途或者向任何
#     第三方转让**）、**第十八条**（**管控名单**，不得违规与其交易）、**第十九条**（应向海关**交验许可证件**）、
#     **第二十条**（不得为违法行为提供代理、货运、寄递、报关等**服务**）、**第二十一条**（申请时应**如实提交**材料）。
#   ⚠️ **"本插件不持有管制清单"这条边界，现在有逐字依据而不是取用状态的理由**：
#     **第四条规定管制清单由"国家"制定**、第九条进一步规定其**会被调整并可临时管制**（不超过二年）——
#     ⇒ **管制清单是国家层面动态发布的文件，任何离线副本都注定过期**；
#     **一个内置了清单副本的插件会在清单调整后立即给出错误结论。**
#   ⚠️ **两用物项出口管制清单、许可证管理办法、军品出口专营办法本次仍未取得逐字条文**，
#     故每条 excerpt 如实写明，kind 保持 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定某物项是否属于管制物项、
#   是否需要申请许可、是否可能构成违规出口**。
#   那需要出口经营者依法判断，并由主管部门认定。
#   → **本插件不内置管制清单**：它没有能力把商品编号或技术参数映射到管制清单条目上，
#     也**不试图做这件事**。"是否受控"栏是台账自己声明的，本插件只核对声明之后有没有闭环。
#   → 因此它**发现不了"该申报受控却没申报"** —— 这是本插件最重要的能力边界，写进规则与 README。
#   → **管制类别清单（categories）与受控判定值（controlledValues）都出厂为空**。

plugin: dsh-export-ctl-check
version: "2026.1"

rules:
  - id: EC-001
    title: 每条物项都应标明是否受控
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十二条——出口管制清单所列管制物项或者临时管制物项，出口经营者应当申请许可；不属于清单的，经营者知道或应当知道存在法定风险的亦应申请
      excerpt: 国家对管制物项的出口实行许可制度。出口管制清单所列管制物项或者临时管制物项，出口经营者应当向国家出口管制管理部门申请许可。
      kind: derived-from-principle
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: presence
          field: controlled
          fix: 补填是否受控；本条只核对是否声明，不判断该判断是否正确
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定，见 rules/evidence/clause-verification.md）：
      **所引第十二条要求的是"出口经营者申请许可"这一行为**，**不是"台账必须有一栏写是否受控"** ——
      "是否受控"这一栏是**本插件核对流程所需的中间判断节点**，其必要性来自插件自身，**不是条文规定**。
      ⇒ 故**保留 `derived-from-principle`（封顶 warn）**，且 `excerpt` 已换为**逐字引文**（第十二条第一款与第二款）。
      "是否受控"是台账的**第一个判断节点**：不写明，后面的许可证核对就无从谈起。
      本次未取得明文条号，故封顶 warn。
      ⚠️ 本条只核对这一栏**是否填写**，**不核对填得对不对** ——
      判断某物项是否属于管制物项需要对照管制清单，**本插件不内置清单、也不做这个映射**。

  - id: EC-002
    title: 受控物项应填写出口许可证号
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十二条——国家对管制物项的出口实行许可制度
      excerpt: 国家对管制物项的出口实行许可制度。
      kind: direct
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: conditionalPresence
          conditionField: controlled
          requiredFields: ["licenseNo"]
          conditionValues: ["是","Y","yes","true","受控","√"]
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**所引第十二条第一款逐字为**
      「**国家对管制物项的出口实行许可制度。**」—— **受控物项须经许可**是条文的直接要求，
      **许可证号即该许可在台账上的凭据**；"受控却无证号"直接对应该条规定的许可义务。
      ⇒ 本条的 `excerpt` 已换为**逐字引文**，`kind` 升为 `direct`（`severity` 仍为 warn，见 README 的分层说明）。
      受控物项若无许可证号，台账就出现了**闭环缺口**：要么尚未取得许可，
      要么清单本身填得不全。本次未取得明文条号，故封顶 warn。
      ⚠️ 判定"是否受控"的取值由 conditionValues 配置，**本插件不内置管制清单**。
      本条只核对许可证号是否填写，**不判断该许可证是否真实有效、是否覆盖该物项与目的地**。

  - id: EC-003
    title: 填写许可证号的物项应写明发证日期
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十九条——出口管制货物时应当向海关交验由国家出口管制管理部门颁发的许可证件
      excerpt: 出口货物的发货人或者代理报关企业出口管制货物时，应当向海关交验由国家出口管制管理部门颁发的许可证件，并按照国家有关规定办理报关手续。
      kind: derived-from-principle
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: conditionalPresence
          conditionField: licenseNo
          requiredFields: ["licenseAt"]
          conditionValues: []
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **所引第十九条要求"向海关交验许可证件"**，**并未规定许可证"必须有发证日期栏"** ——
      发证日期是**核对许可时序（是否先证后出口）所需的信息**，其必要性来自核对方法。
      ⇒ 保留 `derived-from-principle`；`excerpt` 已换为**逐字引文**。
      许可证有号无日期，就无法核对其是否在有效期内、是否在出口申报之前取得。
      本次未取得明文条号，故封顶 warn。
      本条**只在许可证号已填写时**要求发证日期。
      ⚠️ **本插件不核对许可证的有效期**：有效期长短与延期规则由许可决定书与主管部门规定，
      台账里通常只记证号与日期。

  - id: EC-004
    title: 每条物项都应填写最终用途与最终用户
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十五条——出口经营者应当提交管制物项的最终用户和最终用途证明文件；第十六条并要求最终用户承诺不得擅自改变最终用途或向第三方转让
      excerpt: 出口经营者应当向国家出口管制管理部门提交管制物项的最终用户和最终用途证明文件，有关证明文件由最终用户或者最终用户所在国家和地区政府机构出具。
      kind: direct
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: presenceAny
          fields: ["endUse","endUser"]
          fix: 补填最终用途与最终用户；本条只核对是否填写，不判断其真实性
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第十五条逐字要求提交**
      「**最终用户和最终用途证明文件**」，且明确**由最终用户或其所在国政府机构出具** ——
      台账中的最终用户／最终用途栏**正是这两份证明文件在台账上的记载**，指向同一件事。
      ⇒ `excerpt` 换为**逐字引文**，`kind` 升为 `direct`。
      ⚠️ 第十六条另有**最终用户的承诺义务**（不得擅自改变用途或转让第三方），与第十五条配套。
      最终用途与最终用户是出口管制制度的**核心关切**：管制物项的去向决定了能否出口。
      本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该用途与用户是否真实、是否属于禁止或限制情形**。

  - id: EC-005
    title: 每条物项都应填写最终目的地
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十三条——审查许可申请时综合考虑的因素包括出口目的国家或者地区、最终用户和最终用途
      excerpt: 国家出口管制管理部门综合考虑下列因素，对出口经营者出口管制物项的申请进行审查，作出准予或者不予许可的决定：……（五）出口目的国家或者地区；（六）最终用户和最终用途；……
      kind: direct
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: presence
          field: destination
          fix: 补填最终目的地；本条只核对是否填写，不判断目的地是否受限
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第十三条把「出口目的国家或者地区」
      与「最终用户和最终用途」并列为审查许可时"综合考虑"的法定因素** ——
      目的地因此是**许可制度的法定审查要素**，台账不记目的地即无法对应这一要素。
      ⇒ `excerpt` 换为**逐字引文**（该条共八项，此处节引第（五）（六）项），`kind` 升为 `direct`。
      目的国是判断是否需要许可、适用何种许可条件的**基本要素**。
      本次未取得明文条号，故封顶 warn。
      ⚠️ 本条只核对目的国是否填写，**不判断该目的地是否属于禁运或受限制国家（地区）** ——
      那需要对照主管部门公布的名单与具体规定，**本插件不内置任何国家名单**。

  - id: EC-006
    title: 许可证号不应在同一份台账内重复登记
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第十二条——国家对管制物项的出口实行许可制度
      excerpt: 国家对管制物项的出口实行许可制度。
      kind: derived-from-principle
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: unique
          field: licenseNo
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **没有任何条文规定"许可证号在台账内不得重复"** —— 且**一份许可证覆盖多个物项是正常的**，
      故唯一性只是**台账可追溯性的需要**，不是条文要求。
      ⇒ 保留 `derived-from-principle`；`excerpt` 已换为**逐字引文**。
      许可证号重复可能是正常的（**一份许可证覆盖多个物项**），也可能是抄错。
      因此本条**命中需要人工确认**，而不是直接改号。
      本次未取得明文条号，故封顶 warn。
      若本机构台账本就是"一证多物项"的写法，建议为同一许可证的行加上序号区分，或停用本条。

  - id: EC-007
    title: 管制类别应使用本机构口径的取值
    severity: info
    basis:
      document: 《中华人民共和国出口管制法》
      number: 现行版本本次未核实
      clause: 第二条（管制物项包括两用物项、军品、核以及其他相关货物、技术、服务等物项）—— ⚠️ 本条原先把它挂在《两用物项出口管制清单》名下，2026-10-07 已更正为《出口管制法》
      excerpt: 国家对两用物项、军品、核以及其他与维护国家安全和利益、履行防扩散等国际义务相关的货物、技术、服务等物项（以下统称管制物项）的出口管制，适用本法。
      kind: derived-from-principle
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: enum
          field: category
          values: []
    note: >-
      ⚠️ **两处已于 2026-10-07 更正**（见 rules/evidence/clause-verification.md）：
      ① **依据归属错**：本条原先的 `document` 写《两用物项出口管制清单》，
         而 `clause` 引的却是**《出口管制法》第二条** —— **两者不是同一份文件**；
         已把 `document` 更正为**《中华人民共和国出口管制法》**，并保留"不内置清单"的边界说明。
      ② `excerpt` 由"未取得"换为**第二条第一款的逐字引文**。
      ⚠️ **`kind` 仍为 `derived-from-principle`**：**第二条界定的是"管制物项"的范围**，
      **并未规定任何分类体系**，故"管制类别取值"仍只能按本机构口径核对。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：管制类别的分法（核、导弹、生物、化学、军民两用等）与清单版本相关，
      **本插件不内置管制清单，也不硬编码任何分类体系**。
      本条只核对所填值是否在册，**不判断该物项属于哪一类**。

  - id: EC-008
    title: 物项名称栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《中华人民共和国出口管制法》
      number: 2020 年 10 月 17 日第十三届全国人大常委会第二十二次会议通过，主席令第五十八号公布，自 2020 年 12 月 1 日起施行
      clause: 第二十一条——出口经营者申请出口两用物项时，应当依照法律、行政法规的规定如实提交相关材料
      excerpt: 出口经营者向国家两用物项出口管制管理部门申请出口两用物项时，应当依照法律、行政法规的规定如实提交相关材料。
      kind: direct
      source: https://www.mofcom.gov.cn/zfxxgk/gkml/art/2020/art_76b5fa416a4c42afa8af295eefffdffc.html
    params:
        check:
          kind: containsAny
          field: itemName
          terms: ["【","】","{{","}}","XXX","xxx","待填","待补充","TBD","todo","示例"]
          fix: 物项名称应填写实际名称；残留占位符说明台账是照模板抄的
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定）：**第二十一条逐字要求「如实提交相关材料」** ——
      **物项名称栏残留【】、XXX、待填、TBD 之类占位符，正是"未如实提交材料"**，
      而非仅仅"台账不好看"。⇒ `excerpt` 换为**逐字引文**，`kind` 升为 `direct`。
      台账若直接照抄模板，物项名称栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经盘点了实际物项 —— **在出口管制场合，这比一般的台账缺陷严重得多**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
